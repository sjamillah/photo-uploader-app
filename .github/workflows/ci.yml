name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Read-only by default; only the job that talks to AWS gets a token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  image:
    needs: unit-tests
    # Build, smoke test and push in one job, so the image that answered
    # /health is the image that reaches ECR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      # :latest is the only tag in ECR, so the commit travels inside the image.
      - name: Build
        run: |
          docker build -t app \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} .

      - name: Smoke test
        run: pip install --quiet pytest && SMOKE_IMAGE=app pytest tests/test_image.py -q

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish
        run: |
          remote="${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest"
          docker tag app "$remote"
          docker push "$remote"
