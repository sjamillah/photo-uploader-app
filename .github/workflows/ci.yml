name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Read-only by default; only the job that talks to AWS gets a token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # No pip cache: install-deps.sh passes --no-cache-dir for the image
          # build, so there is nothing on disk for the post step to save.

      - run: bash scripts/install-deps.sh --dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build:
    name: Build and push
    needs: test
    # Pull requests stop after the tests. The OIDC trust would refuse them
    # anyway, since it is pinned to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Local build tag only; the published name comes from the secret.
      IMAGE: ci-candidate

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          platforms: linux/amd64
          # Attestations add an unknown/unknown entry to the image index that
          # confuses ECS and CodeDeploy.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash scripts/smoke-test.sh "$IMAGE"

      # TEMPORARY, delete once the role assumes cleanly. Prints the role name
      # the secret resolves to and the claims GitHub is actually sending, so
      # they can be compared against the trust policy character by character.
      - name: What are we sending
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "role in the secret: ${ROLE##*/}"
          echo "account in the secret: $(echo "$ROLE" | cut -d: -f5)"
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); [print(k, "=", repr(c.get(k))) for k in ("sub","aud","repository","repository_owner","ref")]' "$token"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish
        run: |
          bash scripts/publish-image.sh "$IMAGE" \
            "${{ steps.ecr.outputs.registry }}" \
            "${{ secrets.ECR_REPOSITORY }}" \
            "${{ github.sha }}"
